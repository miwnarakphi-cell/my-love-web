<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>งั่มม</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit&family=Mali&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Kanit',sans-serif;
  background: linear-gradient(135deg,#ffd6e8,#ffeaf4,#fff0f7);
  overflow:hidden;
}

/* หัวข้อ */
header {
  text-align:center;
  padding:30px;
  position:relative;
  z-index:2;
}
h1 {
  font-size:60px;
  color:#ff4d88;
  text-shadow:2px 2px 10px #ff99aa;
}

/* รูปหลัก */
main {
  display:flex;
  justify-content:center;
  align-items:center;
  height:60vh;
  position:relative;
  z-index:2;
}
.collage {
  display:flex;
  gap:40px;
}
.collage img {
  width:350px;
  border-radius:15px;
  box-shadow:5px 10px 25px rgba(0,0,0,0.3);
  cursor:pointer;
}

/* ปุ่ม */
.btn {
  display:block;
  margin:15px auto;
  padding:12px 25px;
  background:#ff4d88;
  color:#fff;
  border:none;
  border-radius:25px;
  font-size:18px;
  cursor:pointer;
  position:relative;
  z-index:2;
}

/* การ์ดข้อความ */
.card {
  text-align:center;
  font-family:'Mali',cursive;
  font-size:22px;
  color:#cc3366;
  margin-top:10px;
  position:relative;
  z-index:2;
}

/* Lightbox */
#lightbox {
  position:fixed;
  display:none;
  justify-content:center;
  align-items:center;
  width:100%; height:100%;
  background:rgba(0,0,0,0.8);
  z-index:999;
}
#lightbox img {
  max-width:90%;
  border-radius:10px;
}

/* หัวใจ */
.heart {
  position:absolute;
  z-index:0;
  animation:floatUp 4s linear forwards;
}
@keyframes floatUp {
  0% {transform:translateY(0);}
  100% {transform:translateY(-150px); opacity:0;}
}

/* ดอกไม้ */
.flower {
  position:absolute;
  z-index:0;
  animation:fall 6s linear infinite;
}
@keyframes fall {
  0% {transform:translateY(-50px);}
  100% {transform:translateY(100vh);}
}
</style>
</head>

<body>

<header>
  <h1>คนนี้ของเด้กก</h1>
</header>

<main>
  <div class="collage">
    <img src="p11.jpg">
    <img src="p12.jpg">
  </div>
</main>

<button class="btn" onclick="randomLove()">กดดูความในใจ 💌</button>
<div class="card" id="loveText"></div>

<!-- Lightbox -->
<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img">
</div>

<script>

/* Lightbox */
document.querySelectorAll(".collage img").forEach(img=>{
  img.onclick=()=>{
    document.getElementById("lightbox").style.display="flex";
    document.getElementById("lightbox-img").src=img.src;
  }
});

/* ข้อความสุ่ม */
const messages=[
"คิดถึงนะ 💖",
"อยู่ด้วยกันไปนานๆนะ 🥺",
"รักมากจริงๆ 💕",
"เธอสำคัญที่สุด 💗"
];

function randomLove(){
  const m=messages[Math.floor(Math.random()*messages.length)];
  document.getElementById("loveText").innerText=m;
}

/* การ์ดสลับ */
setInterval(()=>{
  const m=messages[Math.floor(Math.random()*messages.length)];
  document.getElementById("loveText").innerText=m;
},4000);

/* หัวใจลอย */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*window.innerWidth+"px";
  h.style.fontSize=(20+Math.random()*30)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
},500);

/* ดอกไม้ลอย */
setInterval(()=>{
  const f=document.createElement("div");
  f.className="flower";
  f.innerHTML="🌸";
  f.style.left=Math.random()*window.innerWidth+"px";
  f.style.fontSize="20px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),6000);
},800);

/* รูปตกแต่งทั่วจอ (ใช้ p11 / p12) */
const images = ["p11.jpg", "p12.jpg"];

for(let i=0;i<8;i++){
  const img = document.createElement("img");

  img.src = images[Math.floor(Math.random()*images.length)];

  img.style.position = "absolute";
  img.style.left = Math.random()*window.innerWidth + "px";
  img.style.top = Math.random()*window.innerHeight + "px";

  img.style.width = (120 + Math.random()*120) + "px";
  img.style.transform = "rotate(" + (-20 + Math.random()*40) + "deg)";

  img.style.opacity = "0.6";
  img.style.zIndex = "1";
  img.style.borderRadius = "10px";
  img.style.boxShadow = "3px 5px 15px rgba(0,0,0,0.2)";

  document.body.appendChild(img);
}

</script>

</body>
</html>
